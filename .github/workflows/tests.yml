name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Managed deployment is POSIX-only, so there is no Windows job.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    uses: qiboteam/workflows/.github/workflows/test.yml@uv
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      uv-extras: --no-dev --all-extras
    secrets: inherit
