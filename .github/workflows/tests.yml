name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.package }} (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        # Managed deployment is POSIX-only, so there is no Windows job.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
        package: [mcp, agent]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install the workspace
        run: uv sync --locked
      - name: Test ${{ matrix.package }}
        run: uv run pytest packages/${{ matrix.package }}/tests
