[project]
name = "qibocal-agent"
version = "0.1.0"
description = "Orchestration for Qibocal MCP servers: SSH and SLURM traversal, configuration, report serving and an autonomous agent."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["fastmcp>=3.0,<4"]

[project.optional-dependencies]
agent = ["pydantic-ai-slim[mcp,openai]>=2.54,<3"]

[project.scripts]
qibocal-agent = "qibocal_agent.agent:main"
qibocal-mcp-remote = "qibocal_agent.remote:main"
qibocal-report-server = "qibocal_agent.report:main"
qibocal-mcp-config = "qibocal_agent.config:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "qibocal_agent"
