<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="670" viewBox="0 0 1050 670" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic illustrative spectroscopy report, not hardware evidence</title>
  <desc id="desc">An original explanatory plot of arbitrary normalized signal versus frequency offset in MHz. Outlined sample markers follow a blue illustrative dip centered near plus one MHz, with baseline on either side. A dashed center guide and notes encourage inspection of fit agreement, sweep edges and uncertainty. The samples, fit and center are synthetic; the picture is not generated by Qibocal and reports no measured hardware result.</desc>
  <rect width="1050" height="670" rx="14" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="35" y="40" font-size="25" font-weight="bold">Reading a spectroscopy picture</text>
    <rect x="35" y="56" width="980" height="42" rx="6" fill="#fff7ed" stroke="#9a3412" stroke-width="2"/>
    <text x="52" y="83" font-size="18" font-weight="bold">SYNTHETIC / ILLUSTRATIVE ONLY - not genuine hardware evidence or Qibocal output</text>
    <rect x="110" y="130" width="720" height="360" fill="#ffffff" stroke="#94a3b8"/>
    <g stroke="#cbd5e1" stroke-width="1">
      <path d="M110 202 H830 M110 274 H830 M110 346 H830 M110 418 H830"/>
      <path d="M290 130 V490 M470 130 V490 M650 130 V490"/>
    </g>
    <path d="M110 130 V490 H830" fill="none" stroke="#172033" stroke-width="2"/>
    <g font-size="16">
      <text x="65" y="137">1.0</text>
      <text x="65" y="209">0.8</text>
      <text x="65" y="281">0.6</text>
      <text x="65" y="353">0.4</text>
      <text x="65" y="425">0.2</text>
      <text x="65" y="497">0.0</text>
      <text x="97" y="516">-10</text>
      <text x="280" y="516">-5</text>
      <text x="465" y="516">0</text>
      <text x="645" y="516">5</text>
      <text x="818" y="516">10</text>
    </g>
    <text x="340" y="548" font-size="19">Frequency offset (MHz)</text>
    <text x="30" y="403" font-size="18" transform="rotate(-90 30 403)">Normalized signal (arbitrary units)</text>
    <path d="M110 190 C185 190 246 193 290 200 C345 210 393 242 430 302 C464 355 481 411 506 414 C532 413 553 350 579 297 C612 237 646 212 690 201 C737 192 778 190 830 190" fill="none" stroke="#075985" stroke-width="4"/>
    <path d="M506 130 V490" stroke="#475569" stroke-width="2" stroke-dasharray="7 5"/>
    <g fill="#ffffff" stroke="#172033" stroke-width="2">
      <circle cx="110" cy="194" r="5"/><circle cx="182" cy="185" r="5"/>
      <circle cx="254" cy="198" r="5"/><circle cx="326" cy="208" r="5"/>
      <circle cx="398" cy="259" r="5"/><circle cx="434" cy="304" r="5"/>
      <circle cx="470" cy="392" r="5"/><circle cx="506" cy="408" r="5"/>
      <circle cx="542" cy="378" r="5"/><circle cx="578" cy="302" r="5"/>
      <circle cx="614" cy="235" r="5"/><circle cx="686" cy="207" r="5"/>
      <circle cx="758" cy="187" r="5"/><circle cx="830" cy="195" r="5"/>
    </g>
    <text x="120" y="160" font-size="16" font-weight="bold">Baseline on both sides</text>
    <text x="527" y="465" font-size="16">Illustrative center: +1 MHz</text>
    <path d="M850 161 H888" stroke="#075985" stroke-width="4"/>
    <text x="899" y="167" font-size="16">Fit</text>
    <circle cx="870" cy="199" r="5" fill="#fff" stroke="#172033" stroke-width="2"/>
    <text x="899" y="205" font-size="16">Samples</text>
    <text x="850" y="258" font-size="17" font-weight="bold">Inspect:</text>
    <text x="850" y="289" font-size="16">Fit agreement</text>
    <text x="850" y="317" font-size="16">Signal quality</text>
    <text x="850" y="345" font-size="16">Sweep coverage</text>
    <text x="850" y="387" font-size="16">Consult actual</text>
    <text x="850" y="411" font-size="16">fit uncertainty.</text>
    <text x="850" y="453" font-size="16">No acceptance</text>
    <text x="850" y="477" font-size="16">threshold here.</text>
    <rect x="35" y="572" width="980" height="73" rx="8" fill="#e0f2fe" stroke="#075985"/>
    <text x="52" y="600" font-size="17">A visible feature is not sufficient evidence for an update: check the real table, units and uncertainty.</text>
    <text x="52" y="626" font-size="17">This axis is an offset, not absolute drive frequency. Samples and fit are drawn examples, not measurements.</text>
  </g>
</svg>
