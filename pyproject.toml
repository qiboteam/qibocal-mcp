[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8", "qibocal-mcp", "qibocal-agent[agent]"]
docs = ["sphinx>=8,<9", "furo>=2024.8.6"]

[tool.uv.sources]
qibocal-mcp = { workspace = true }
qibocal-agent = { workspace = true }

[tool.poe.tasks]
docs = "sphinx-build -W --keep-going -b html docs docs/_build/html"
