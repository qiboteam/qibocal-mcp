[project]
name = "qibocal-mcp-servers"
version = "0.0.1"
description = "Qibo MCP servers for quantum calibration."
authors = [{name = "The Qibo team"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
keywords = []
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.11,<3.14"
dependencies = [
  "qibocal @ git+https://github.com/qiboteam/qibocal@main",
  "qibolab>=0.2.16,<0.3.0", # 0.2.16 exports ChannelId
  "qibo>=0.3.1,<0.4.0",
  "numpy>=2.0.0,<3.0.0",
  "scipy>=1.10.1,<2.0.0",
  "scikit-learn>=1.3.0,<2.0.0",
  "pandas[html]>=3.0.0,<4.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "click>=8.1.3,<9.0.0",
  "jinja2>=3.1.2,<4.0.0",
  "matplotlib>=3.10.9,<4.0.0",
  "plotly>=7.0.0,<8.0.0",
  "skops>=0.14.0,<0.15.0",
  "pyyaml>=6.0.0,<7.0.0",
  # Limiting FastMCP to this range for compatibility with older MCP clients 
  # (copilot CLI does not support 2026-07-28 protocol but 2025-11-25)
  "fastmcp>=4.0.0,<4.0.10",
]

[project.urls]
Homepage = "https://qibo.science/"

[project.scripts]
qibocal-mcp = "calibration_mcp_servers:main"

[dependency-groups]
tests = [
  "pytest>=9.0.0,<10.0.0",
  "pytest-cov>=7.0.0,<8.0.0",
  "pytest-mock>=3.14.0,<4.0.0",
]
analysis = [
  "ruff>=0.16.0,<0.17.0",
]
dev = [
  "ipython>=9.0.0,<10.0.0",
  "devtools>=0.12.0,<0.13.0",
  "marimo>=0.24.0,<0.25.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["calibration_mcp_servers", "skills"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
extend-select = ["I", "UP"]
ignore = ["BLE001"] # TODO: BLE001 is about except Exception, fix properly

[tool.ruff.lint.per-file-ignores]
"calibration_scripts/**/*.py" = ["F821"]
"tests/calibration_scripts/**/*.py" = ["F821"]
"doc/dev/*.py" = ["B018"] # Marimo notebooks may use bare expressions to render output

[tool.poe.tasks]
test = "pytest"
lint = "ruff check"
lint-warnings = """
  ruff check --exit-zero \
  --select F,E,W,C90,N,UP,BLE,FBT,B,A,C4,T10,EM,EXE,ISC,ICN,LOG,G,INP,PIE,T20,PT,Q,RSE,\
           RET,SLF,SLOT,SIM,TC,INT,ARG,PTH,ERA,NPY,PERF,RUF
"""
types = "true"

[tool.pytest.ini_options]
testpaths = ['tests/']
