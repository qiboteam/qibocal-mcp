[project]
name = "qibocal-agent"
version = "0.1.0"
description = "An autonomous Qibocal calibration agent with a standalone MCP server."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastmcp>=3.0,<4",
    "kaleido>=1.0,<2",
    "qibocal @ git+https://github.com/qiboteam/qibocal@87abd3350612b72e64b09db115ee0cf22886b507",
]

[project.optional-dependencies]
agent = ["pydantic-ai-slim[mcp,openai]>=2.54,<3"]
docs = ["sphinx>=8,<9"]

[project.scripts]
qibocal-mcp = "qibocal_mcp.server:main"
qibocal-agent = "qibocal_mcp.agent:main"
qibocal-mcp-config = "qibocal_mcp.config:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "qibocal_mcp"
