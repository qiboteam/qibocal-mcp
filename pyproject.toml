[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.14", "qibocal-mcp", "qibocal-agent[agent]"]
docs = ["sphinx>=8,<9", "furo>=2024.8.6", "sphinx-click>=6,<7"]

[tool.uv.sources]
qibocal-mcp = { workspace = true }
qibocal-agent = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Explicit, so that newer ruff defaults do not change what fails the build.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["qibocal_mcp", "qibocal_agent"]

[tool.pytest.ini_options]
testpaths = ["packages/mcp/tests", "packages/agent/tests"]

[tool.poe.tasks]
test = "pytest --cov=qibocal_mcp --cov=qibocal_agent --cov-report=xml --cov-report=term"
lint = "ruff check"
lint-warnings = """
  ruff check --exit-zero \
  --select F,E,W,C90,N,UP,BLE,FBT,B,A,C4,T10,EM,EXE,ISC,ICN,LOG,G,INP,PIE,T20,PT,Q,RSE,\
           RET,SLF,SLOT,SIM,TC,INT,ARG,PTH,ERA,NPY,PERF,RUF
"""
docs = "sphinx-build -W --keep-going -b html docs docs/_build/html"
man = "sphinx-build -W --keep-going -b man docs docs/_build/man"
